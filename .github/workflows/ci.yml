name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The suite's shared pipeline: leak scan, design check, lint, unit tests, build, keyless deploy
  # of Hosting on main, smoke tests against the live site.
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # README screenshots, PR evidence branch
      id-token: write
      pull-requests: write # before/after comment on PRs
    with:
      hosting-target: tasks
      site-url: https://huishouden-tasks.web.app

  # What only this app has: the signed-in browser flows, run against the Auth and Firestore
  # emulators with the household's real rules from huishouden/rules main.
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-app-tests-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:local
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  release:
    uses: huishouden/pwa-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      pull-requests: write
