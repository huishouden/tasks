name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      # Same gate as `bun run verify` locally: types, unit tests, security rules against the emulator, build.
      - run: bun run verify
      - run: bunx playwright install --with-deps chromium
      # Browser flows against the Auth and Firestore emulators (two users, slow network, all layouts).
      - run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: web/dist
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud through Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: web/dist
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx firebase deploy --only hosting,firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --message "${{ github.sha }}"
      - run: bunx playwright install --with-deps chromium
      # Read-only smoke test of the site just deployed: config, manifest, offline worker, Google sign-in allowed.
      - run: bun run e2e:live
