name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The suite's shared pipeline: leak scan, design check, lint, unit tests, build, keyless deploy
  # of Hosting on main, smoke tests against the live site.
  pwa:
    uses: piekstra/huishouden-pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # README screenshots, PR evidence branch
      id-token: write
      pull-requests: write # before/after comment on PRs
    with:
      hosting-target: tasks
      site-url: https://huishouden-tasks.web.app

  # What only this app has: the household's Firestore rules (tested against the emulator) and the
  # signed-in browser flows, which need the Auth and Firestore emulators.
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-app-tests-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:rules
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:local
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # This repo owns the project's single rules file (the other apps send their blocks here).
  firestore-rules:
    needs: [pwa, app-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx firebase deploy --only firestore:rules --project huishouden-piekstra --non-interactive --message "${{ github.sha }}"

  release:
    uses: piekstra/huishouden-pwa-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      pull-requests: write
